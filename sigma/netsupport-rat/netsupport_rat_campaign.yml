title: WScript or CScript Creating LNK Files in Startup Folder
id: 41dcb72c-855e-4969-81c6-dd4b40aaaa17
status: experimental
description: |
  Detects wscript.exe or cscript.exe creating shortcut (.lnk) files in a user's Startup folder.
  The analyzed NetSupport RAT campaign used shortcut files and Startup-folder persistence.
author: secoft
date: 2026-09-28
tags:
  - attack.persistence
  - attack.t1547.001
  - attack.execution
  - attack.t1059.007
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
    TargetFilename|contains: '\Start Menu\Programs\Startup\'
    TargetFilename|endswith: '.lnk'
  condition: selection
falsepositives:
  - Legitimate logon or deployment scripts that create Startup shortcuts; tune for the environment.
level: high
---
title: WScript or CScript Spawning Command Shell
id: 9d81de13-7cc4-4627-82ab-182548c7a9cb
status: experimental
description: |
  Detects wscript.exe or cscript.exe spawning cmd.exe. This parent-child relationship was observed
  in the execution chain of the JavaScript dropper used to deploy NetSupport RAT.
author: secoft
date: 2026-09-28
tags:
  - attack.execution
  - attack.t1059.003
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
  selection_child:
    Image|endswith: '\cmd.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Administrative or deployment scripts that intentionally launch cmd.exe through Windows Script Host.
level: medium
---
title: NetSupport Components Executed from ProgramData
id: 78f10af5-5d8b-47f6-9f41-a598a576ab00
status: experimental
description: |
  Detects NetSupport-related executables observed in this campaign running from ProgramData.
  The analyzed sample dropped nt32.exe and remcmdstub.exe under a ProgramData subdirectory.
author: secoft
date: 2026-09-28
tags:
  - attack.command_and_control
  - attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\nt32.exe'
      - '\remcmdstub.exe'
  selection_path:
    Image|contains: '\ProgramData\'
  condition: selection_image and selection_path
falsepositives:
  - Legitimate NetSupport deployments using ProgramData; verify against asset inventory and expected installation paths.
level: medium
---
title: Proxy Request to Known NetSupport Campaign C2 Endpoint
id: da1254aa-6112-45ce-8a4b-13b4b3747934
status: experimental
description: |
  IOC-based detection for HTTP requests to the observed NetSupport RAT campaign C2 endpoint
  85.239.149.75/fakeurl.htm. Infrastructure can change quickly; use primarily for retro-hunting
  and incident scoping. Proxy field names may require mapping for the target SIEM.
author: secoft
date: 2026-09-28
tags:
  - attack.command_and_control
  - attack.t1071.001
logsource:
  category: proxy
detection:
  selection_ip:
    c-uri|contains: '85.239.149.75'
  selection_uri:
    cs-uri-stem|endswith: '/fakeurl.htm'
  condition: selection_ip and selection_uri
falsepositives:
  - Unlikely for the exact IP and URI combination.
level: high
